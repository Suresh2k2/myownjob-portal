services:
  - type: web
    runtime: python
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
  - type: web
    name: job-portal-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://myownjob-portal.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
